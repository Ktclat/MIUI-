name: Source build and offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Compile project-owned launcher
        shell: powershell
        run: .\build.ps1
      - name: Run synthetic file and source tests
        shell: powershell
        run: .\test.ps1
      - name: Rebuild and test our native helper against memory stubs
        shell: powershell
        run: .\verify-native.ps1
      - name: Reject accidentally tracked binaries or private outputs
        shell: python
        run: |
          import pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          blocked = {'.exe', '.dll', '.sys', '.apk', '.ico', '.zip', '.7z', '.pdb', '.dmp', '.log', '.obj', '.o', '.lib', '.a', '.bin', '.msi', '.cab', '.pfx'}
          for text in filter(None, paths):
              path = pathlib.PurePosixPath(text)
              if path.suffix.lower() in blocked or path.parts[0] in {'vendor', 'app', 'artifacts', 'diagnostics'}:
                  raise SystemExit('Unexpected tracked private/vendor artifact: ' + text)
